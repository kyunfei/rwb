name: Auto Merge Branches

# 安全说明（2026-08 调整）：
# 原先监听「除 master 外所有分支」的 push，会把未审阅代码自动合进 master，
# 并连带触发 build.yml 打包发布。多分支并行开发时风险过高。
#
# 现改为仅当推送分支名匹配 auto/** 时才自动合并（显式 opt-in）。
# 需要恢复「任意特性分支 push 即合 master」时，把 on.push.branches 改回：
#   - '**'
#   - '!master'
on:
  push:
    branches:
      - 'auto/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Git identity
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Fetch all branches
        run: git fetch origin

      - name: Try to merge and resolve conflicts
        id: merge
        continue-on-error: true
        run: |
          git checkout master
          git pull origin master
          git merge --no-ff ${{ github.ref_name }} --strategy-option theirs || true
          if [ -f .git/MERGE_HEAD ]; then
            echo "conflict=true" >> $GITHUB_OUTPUT
          else
            echo "conflict=false" >> $GITHUB_OUTPUT
          fi

      - name: Push merged changes if no conflict
        if: steps.merge.outputs.conflict == 'false'
        run: |
          git push origin master

      - name: Create or update Pull Request if conflict
        if: steps.merge.outputs.conflict == 'true'
        id: create-pr
        uses: repo-sync/pull-request@v2
        with:
          source_branch: ${{ github.ref_name }}
          destination_branch: master
          pr_title: "自动合并 ${{ github.ref_name }}"
          pr_body: "由 GitHub Actions 自动创建的合并请求\n\n⚠️ 检测到冲突，需要人工审查解决"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge on PR
        if: steps.create-pr.outputs.pr_number != ''
        run: |
          pr_number=${{ steps.create-pr.outputs.pr_number }}
          gh pr merge $pr_number --auto --merge -R ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
